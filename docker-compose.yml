services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wearable
      POSTGRES_USER: aevum
      POSTGRES_PASSWORD: aevum
    ports:
      - "5432:5432"
    volumes:
      - wearable_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aevum -d wearable"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      AEVUM_DATABASE_URL: postgresql+asyncpg://aevum:aevum@postgres:5432/wearable
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  wearable_postgres:
