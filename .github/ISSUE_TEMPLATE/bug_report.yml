name: Bug report
description: Report a reproducible problem in Aevum
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Aevum. Do not disclose security vulnerabilities here; use the private reporting instructions in SECURITY.md.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I am using the latest code from the default branch.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Mobile app
        - API
        - PostgreSQL or Docker Compose
        - Shared contracts
        - Sensor simulator
        - Documentation or tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what went wrong and what you expected instead.
      placeholder: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start...
        2. Open...
        3. Select...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, device, Expo SDK/development-build version, Node, pnpm, Python, and Docker versions as relevant.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove credentials, tokens, personal data, and private network details before attaching anything.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other details that may help diagnose the issue.
